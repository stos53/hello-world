<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Atlanta Schedule Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #6c63ff;
      --gold: #f5a623;
      --muted: #6b7280;
      --text: #e5e7eb;
      --green: #22c55e;
      --red: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    header { margin-bottom: 16px; }

    h1 { font-size: 1.25rem; font-weight: 700; color: #fff; }

    .subtitle { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .refresh-btn {
      flex: 1;
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .refresh-btn:active { opacity: 0.8; }
    .refresh-btn:disabled { opacity: 0.5; cursor: default; }

    .countdown-wrap {
      text-align: right;
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .countdown-wrap span {
      display: block;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, monospace;
    }

    .status {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .status-dot.ok { background: var(--green); }
    .status-dot.err { background: var(--red); }
    .status-dot.loading {
      background: var(--accent);
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin: 20px 0 8px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute;
      left: 0; top: 12px; bottom: 12px;
      width: 3px;
      background: var(--accent);
      border-radius: 0 3px 3px 0;
    }

    .card-time {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .card-location {
      font-size: 0.8rem;
      color: var(--accent);
      margin-top: 3px;
      font-weight: 500;
    }

    .card-names {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .fighter {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }
    .fighter-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      width: 30px;
      flex-shrink: 0;
    }

    .card-division {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 8px;
    }

    .vs-divider {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding-left: 38px;
    }

    .raw-fallback {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 0.72rem;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 60vh;
      overflow-y: auto;
    }

    .error-card {
      background: #1f1215;
      border: 1px solid #3d1a22;
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--red);
      font-size: 0.85rem;
      margin-bottom: 10px;
      line-height: 1.6;
    }
    .error-card a { color: var(--accent); }
    .error-card strong { display: block; margin-bottom: 6px; }

    .info-card {
      background: #111827;
      border: 1px solid #1e3a5f;
      border-radius: 12px;
      padding: 14px 16px;
      color: #93c5fd;
      font-size: 0.85rem;
      margin-bottom: 10px;
      line-height: 1.6;
    }
    .info-card a { color: var(--accent); }

    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--border) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
      height: 16px;
      margin-bottom: 6px;
    }
    @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }

    .source-link {
      display: block;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 24px;
      text-decoration: none;
    }
    .source-link:hover { color: var(--accent); }

    .name-filter-wrap { margin-bottom: 14px; }
    .name-filter-label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 5px; display: block; }
    .name-filter-row { display: flex; gap: 6px; }
    .share-btn {
      flex-shrink: 0;
      padding: 9px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, border-color 0.2s;
    }
    .share-btn:active { opacity: 0.8; }
    .name-filter-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .name-filter-input:focus { border-color: var(--accent); }
    .name-filter-input::placeholder { color: var(--muted); }
    .name-filter-hint { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }
    .name-tag { display: inline-block; background: var(--accent); color: #fff; border-radius: 4px; padding: 1px 7px; font-size: 0.72rem; margin: 3px 3px 0 0; }
  </style>
</head>
<body>

<header>
  <h1>Battle of Atlanta</h1>
  <div class="subtitle">Schedule Tracker</div>
</header>

<div class="top-bar">
  <button class="refresh-btn" id="refresh-btn" onclick="doFetch(true)">Refresh Now</button>
  <div class="countdown-wrap">
    <span id="countdown">120</span>
    next refresh
  </div>
</div>

<div class="name-filter-wrap">
  <label class="name-filter-label" for="name-filter">Competitors</label>
  <div class="name-filter-row">
    <input class="name-filter-input" id="name-filter" type="text"
      placeholder="Last names, comma-separated"
      autocomplete="off" autocorrect="off" autocapitalize="off">
    <button class="share-btn" id="share-btn" onclick="copyShareLink()">Copy Link</button>
  </div>
  <div class="name-filter-hint" id="name-tags"></div>
</div>

<div class="status" id="status">
  <div class="status-dot loading" id="status-dot"></div>
  <span id="status-text">Loading…</span>
</div>

<div id="container">
  <div class="card">
    <div class="skeleton" style="width:45%"></div>
    <div class="skeleton" style="width:30%;margin-top:4px"></div>
    <div class="skeleton" style="width:70%;margin-top:12px"></div>
    <div class="skeleton" style="width:60%"></div>
  </div>
</div>

<a class="source-link" id="source-link" target="_blank" rel="noopener">
  View on MatAction ↗
</a>

<script>
// ─── Config ──────────────────────────────────────────────────────────────────
const REFRESH_SECS = 120; // 2 minutes — avoids proxy rate limits
const FETCH_TIMEOUT_MS = 30000; // 30 s per proxy attempt

const REG_IDS = [
  '5ddaab7b-1fa1-40bd-abd7-784d85b87737',
  '70acab5c-d792-4ee8-86b2-387922876848',
  '72768763-49e1-4c62-8fd2-e18f2632c33b',
  '7e333057-18eb-47d0-9ed1-bda71d07b26f',
  'bd767c42-dced-4163-b454-51fb98c285fd',
  'c7b53c77-eec7-4734-af3d-61ae40143145',
  'c838bdec-7007-49ce-b69d-365adbdce4e4',
  'ccdd8082-655f-4c24-9d91-55c0d1972001',
  'dc828c9e-aad7-4377-a5b3-83cb0b4dd215',
  'ebedec5a-947c-431b-a43c-b2594d78be97',
  'f90b389b-3454-4e36-8054-d12e34d01166',
  '8bc13f89-6954-44fa-8fc9-5777e32b8591',
];

// Full URL with regs[] params — used only for the "View on MatAction" link.
// Proxies receive the bare URL; the long query string causes 413/400 on some proxies
// and the server ignores regs[] for filtering anyway (it's client-side JS on their end).
function buildSourceUrl() {
  const base = 'https://www.mataction.com/battle-of-atlanta/schedule';
  const p = new URLSearchParams();
  p.set('search', '');
  p.set('age', 'all');
  p.set('age_filter', '');
  p.set('weight', '');
  p.set('weight_unit', '0');
  REG_IDS.forEach(id => p.append('regs[]', id));
  return base + '?' + p.toString();
}
const SOURCE_URL = buildSourceUrl();
const FETCH_URL = 'https://www.mataction.com/battle-of-atlanta/schedule';

// Set the source link href
document.getElementById('source-link').href = SOURCE_URL;

// ─── Name filter ─────────────────────────────────────────────────────────────
// Default competitors — last names cover all 11 athletes (Fazio matches both Chris & Lily)
const DEFAULT_NAMES = 'DeVine,Fonseca,Kahoohanohano,Kasarla,Murphy,Osechas,Fazio,Hindle,Castro,Nunez';

const STORAGE_KEY = 'boa_name_filter';
let nameTerms = []; // lowercase partial strings to match against competitor names

function loadNameFilter() {
  const urlNames = new URLSearchParams(window.location.search).get('names');
  const saved = urlNames || localStorage.getItem(STORAGE_KEY) || DEFAULT_NAMES;
  if (urlNames) localStorage.setItem(STORAGE_KEY, urlNames); // persist shared link
  document.getElementById('name-filter').value = saved;
  applyNameFilter(saved);
}

function copyShareLink() {
  const terms = document.getElementById('name-filter').value.trim();
  const url = new URL(window.location.href);
  url.search = ''; // clear any existing params
  if (terms) url.searchParams.set('names', terms);
  navigator.clipboard.writeText(url.toString()).then(() => {
    const btn = document.getElementById('share-btn');
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    btn.style.background = 'var(--green)';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; }, 2000);
  });
}

function applyNameFilter(raw) {
  nameTerms = raw.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
  const tagsEl = document.getElementById('name-tags');
  if (nameTerms.length) {
    tagsEl.innerHTML = nameTerms.map(t => `<span class="name-tag">${esc(t)}</span>`).join('');
  } else {
    tagsEl.innerHTML = '<span style="color:var(--muted)">Type names above — separate multiple with commas</span>';
  }
}

document.getElementById('name-filter').addEventListener('input', e => {
  const val = e.target.value;
  localStorage.setItem(STORAGE_KEY, val);
  applyNameFilter(val);
  // Re-render last result if we have one
  if (lastMatches) render(lastMatches, lastFiltered);
});

let lastMatches = null, lastFiltered = false;

function matchesNameFilter(names) {
  if (!nameTerms.length) return true; // no filter = show all
  return nameTerms.some(term =>
    names.some(name => name.toLowerCase().includes(term))
  );
}

// ─── CORS proxies ────────────────────────────────────────────────────────────
// Each entry: [proxyFn, responseParser]
// proxyFn(url) => fetch URL
// responseParser(text) => HTML string
const PROXIES = [
  {
    name: 'allorigins',
    url: u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
    parse: text => { const j = JSON.parse(text); return j.contents || ''; },
  },
  {
    name: 'allorigins-raw',
    url: u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    parse: text => text,
  },
  {
    name: 'corsproxy.io',
    url: u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    parse: text => text,
  },
  {
    name: 'codetabs',
    url: u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
    parse: text => text,
  },
  {
    name: 'thingproxy',
    url: u => `https://thingproxy.freeboard.io/fetch/${u}`,
    parse: text => text,
  },
];

// Track which proxy last succeeded; start there next time
let proxyOrder = [...PROXIES.keys()]; // [0,1,2,3,4]

// ─── State ───────────────────────────────────────────────────────────────────
let countdownTimer = null;
let countdownVal = REFRESH_SECS;
let isFetching = false;

const el = id => document.getElementById(id);

function setStatus(type, msg) {
  el('status-dot').className = 'status-dot ' + type;
  el('status-text').textContent = msg;
}

function resetCountdown() {
  clearInterval(countdownTimer);
  countdownVal = REFRESH_SECS;
  el('countdown').textContent = countdownVal;
  countdownTimer = setInterval(() => {
    countdownVal--;
    el('countdown').textContent = countdownVal;
    if (countdownVal <= 0) doFetch(false);
  }, 1000);
}

// ─── Fetch with per-request timeout ──────────────────────────────────────────
async function fetchWithTimeout(url, timeoutMs) {
  const controller = new AbortController();
  const tid = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
    clearTimeout(tid);
    return res;
  } catch (e) {
    clearTimeout(tid);
    throw e;
  }
}

async function tryProxy(proxy, sourceUrl) {
  const proxyUrl = proxy.url(sourceUrl);
  const res = await fetchWithTimeout(proxyUrl, FETCH_TIMEOUT_MS);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  return proxy.parse(text);
}

async function doFetch(manual = false) {
  if (isFetching) return;
  isFetching = true;
  el('refresh-btn').disabled = true;
  setStatus('loading', 'Fetching live schedule…');
  resetCountdown();

  let html = null;
  let usedProxy = null;
  let errors = [];

  // Try proxies in order, rotating so last-success goes first
  for (let i = 0; i < proxyOrder.length; i++) {
    const idx = proxyOrder[i];
    const proxy = PROXIES[idx];
    setStatus('loading', `Trying ${proxy.name}…`);
    try {
      html = await tryProxy(proxy, FETCH_URL);
      usedProxy = idx;
      break;
    } catch (e) {
      errors.push(`${proxy.name}: ${e.message}`);
    }
  }

  isFetching = false;
  el('refresh-btn').disabled = false;

  if (!html) {
    setStatus('err', 'All proxies failed — tap Refresh');
    renderProxyError(errors);
    return;
  }

  // Promote the winning proxy to front
  if (usedProxy !== null && proxyOrder[0] !== usedProxy) {
    proxyOrder = [usedProxy, ...proxyOrder.filter(i => i !== usedProxy)];
  }

  const { matches, filtered } = parseSchedule(html);
  lastMatches = matches; lastFiltered = filtered;
  if (matches.length > 0) {
    setStatus('ok', `Updated ${new Date().toLocaleTimeString()} via ${PROXIES[usedProxy].name}`);
    render(matches, filtered);
  } else {
    const tmp = new DOMParser().parseFromString(html, 'text/html');
    tmp.querySelectorAll('script,style').forEach(n => n.remove());
    const bodyText = (tmp.body?.textContent || '').trim();

    if (bodyText.length < 300) {
      setStatus('err', 'Page appears JS-rendered — see note below');
      renderJsRendered();
    } else {
      setStatus('ok', `Fetched via ${PROXIES[usedProxy].name} — 0 matches parsed`);
      // Show raw text AND a snippet of raw HTML to help diagnose the structure
      renderRaw(bodyText, html);
    }
  }
}

// ─── Parse ───────────────────────────────────────────────────────────────────
const TIME_RE = /\b(\d{1,2}:\d{2}\s*(?:AM|PM))/gi;
const MAT_RE  = /\b(mat|ring|rink|court|area|floor|platform|table)\s*#?\s*(\d+[A-Z]?)/gi;
const REG_SET = new Set(REG_IDS.map(id => id.toLowerCase()));

// Returns true if a node's outerHTML contains at least one of our registration UUIDs
function nodeContainsTracked(node) {
  const raw = (node.outerHTML || node.textContent || '').toLowerCase();
  return REG_IDS.some(id => raw.includes(id.toLowerCase()));
}

// Filter a results array: keep only entries whose _src html has a UUID.
// If nothing matched (UUIDs aren't embedded in HTML), return all with a warning flag.
function filterByUUID(results) {
  const tracked = results.filter(r => r._tracked);
  return tracked.length > 0 ? { matches: tracked, filtered: true } : { matches: results, filtered: false };
}

function parseSchedule(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const results = [];
  doc.querySelectorAll('script,style,nav,header,footer,noscript').forEach(n => n.remove());

  // Strategy A: any element that carries a data-registration-id attribute
  const regAttrEls = doc.querySelectorAll('[data-registration-id],[data-reg-id],[data-competitor-id],[data-id]');
  if (regAttrEls.length > 0) {
    const seen = new Set();
    regAttrEls.forEach(node => {
      // Only consider nodes whose data attr is one of our IDs
      const attrVal = (node.getAttribute('data-registration-id') || node.getAttribute('data-reg-id') ||
                       node.getAttribute('data-competitor-id') || node.getAttribute('data-id') || '').toLowerCase();
      if (!REG_SET.has(attrVal)) return;
      const parent = node.closest('[class*="match"],[class*="bout"],[class*="row"],[class*="schedule"],tr,li') || node.parentElement;
      if (!parent || seen.has(parent)) return;
      seen.add(parent);
      const m = extractFromContainer(parent);
      if (m) { m._tracked = true; results.push(m); }
    });
    if (results.length) return { matches: results, filtered: true };
  }

  // Strategy B: table rows — collect all, then UUID-filter
  doc.querySelectorAll('table').forEach(table => {
    const headers = Array.from(table.querySelectorAll('th')).map(th => th.textContent.trim().toLowerCase());
    table.querySelectorAll('tbody tr, tr:not(:first-child)').forEach(row => {
      const cells = Array.from(row.querySelectorAll('td'));
      if (cells.length < 2) return;
      const m = extractFromCells(cells, headers);
      if (m) { m._tracked = nodeContainsTracked(row); results.push(m); }
    });
  });
  if (results.length) return filterByUUID(results);

  // Strategy C: class-name cards
  const SEL = [
    '[class*="schedule-item"]','[class*="match-item"]','[class*="bout"]',
    '[class*="fight"]','[class*="match-card"]','[class*="schedule-row"]',
    '[class*="competition"]',
  ].join(',');
  doc.querySelectorAll(SEL).forEach(card => {
    const m = extractFromContainer(card);
    if (m) { m._tracked = nodeContainsTracked(card); results.push(m); }
  });
  if (results.length) return filterByUUID(results);

  // Strategy D: raw text scan (no UUID filtering possible)
  return { matches: extractFromRawText(doc.body?.textContent || ''), filtered: false };
}

function extractFromContainer(node) {
  const text = node.textContent || '';
  const times = text.match(TIME_RE);
  const mats  = text.match(new RegExp(MAT_RE.source, 'gi'));

  const nameEls = node.querySelectorAll(
    '[class*="name"],[class*="competitor"],[class*="athlete"],[class*="player"],[class*="fighter"],[class*="red"],[class*="blue"]'
  );
  const names = Array.from(nameEls)
    .map(n => n.textContent.trim())
    .filter(n => n.length > 2 && n.length < 60 && !/^\d/.test(n));

  if (!times && !mats && !names.length) return null;

  const divEl = node.querySelector('[class*="division"],[class*="category"],[class*="age"],[class*="weight"]');
  return {
    time: times ? times[0] : '',
    location: mats ? mats[0] : '',
    names: dedupe(names),
    division: divEl ? divEl.textContent.trim() : '',
    _tracked: false,
  };
}

function extractFromCells(cells, headers) {
  const texts = cells.map(c => c.textContent.trim());
  let time = '', location = '', names = [], division = '';

  headers.forEach((h, i) => {
    if (!texts[i]) return;
    if (/time|start/i.test(h)) time = texts[i];
    else if (/mat|ring|rink|court/i.test(h)) location = texts[i];
    else if (/division|class|age|weight|category/i.test(h)) division = texts[i];
    else if (/name|competitor|athlete|player|red|blue/i.test(h)) names.push(texts[i]);
  });

  if (!time) { const t = texts.find(t => TIME_RE.test(t)); if (t) time = t.match(TIME_RE)[0]; }
  if (!location) {
    const l = texts.find(t => new RegExp(MAT_RE.source, 'i').test(t));
    if (l) { const m = l.match(new RegExp(MAT_RE.source, 'i')); if (m) location = m[0]; }
  }
  if (!names.length) {
    names = texts.filter(t =>
      t && t.length >= 3 && t.length <= 60 &&
      !TIME_RE.test(t) &&
      !new RegExp(MAT_RE.source, 'i').test(t) &&
      !/^\d+$/.test(t) &&
      (t.includes(' ') || t.length < 25)
    );
  }

  if (!time && !location && !names.length) return null;
  return { time, location, names: dedupe(names), division, _tracked: false };
}

function extractFromRawText(text) {
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const results = [];
  let cur = null;
  lines.forEach(line => {
    const t = line.match(TIME_RE);
    const m = line.match(new RegExp(MAT_RE.source, 'i'));
    if (t || m) {
      if (cur) results.push(cur);
      cur = { time: t ? t[0] : '', location: m ? m[0] : '', names: [], division: '', _tracked: false };
    } else if (cur && line.length > 2 && line.length < 60) {
      cur.names.push(line);
    }
  });
  if (cur) results.push(cur);
  return results;
}

function dedupe(arr) {
  return [...new Set(arr.map(s => s.trim()).filter(Boolean))];
}

// ─── Render ──────────────────────────────────────────────────────────────────
function render(matches, filtered) {
  const nameFiltered = nameTerms.length > 0;
  const afterFilter = nameFiltered ? matches.filter(m => matchesNameFilter(m.names)) : matches;
  // If the name filter wiped everything out, show all matches with a notice rather than a blank screen
  const namesMissed = nameFiltered && afterFilter.length === 0 && matches.length > 0;
  const visible = namesMissed ? matches : afterFilter;

  let filterNote;
  if (namesMissed) filterNote = ` total — names not found, showing all`;
  else if (nameFiltered) filterNote = ` matching "${nameTerms.join(', ')}"`;
  else if (filtered) filterNote = ' for your competitors';
  else filterNote = ' total';

  let warning = '';
  if (namesMissed) {
    warning = `<div class="info-card" style="margin-bottom:12px;font-size:0.8rem;">
      Your name filter didn't match anything in these ${matches.length} results — the schedule may use different name formatting.
      Showing all matches; edit the filter above to narrow down.
    </div>`;
  } else if (!filtered) {
    warning = `<div class="info-card" style="margin-bottom:12px;font-size:0.8rem;">
      ⚠ Could not filter by registration ID — use the name filter above to find your competitors.
    </div>`;
  }

  let html = warning + `<div class="section-label">${visible.length} match${visible.length !== 1 ? 'es' : ''}${filterNote}</div>`;
  visible.forEach(m => {
    const nameRows = m.names.map((name, i) => {
      const label = i === 0 ? 'Red' : i === 1 ? 'Blue' : '';
      return `${i === 1 ? '<div class="vs-divider">vs</div>' : ''}
        <div class="fighter">
          ${label ? `<span class="fighter-label">${label}</span>` : ''}
          ${esc(name)}
        </div>`;
    }).join('');
    html += `
      <div class="card">
        <div class="card-time">${esc(m.time || '—')}</div>
        <div class="card-location">${esc(m.location || 'Location TBD')}</div>
        <div class="card-names">${nameRows || '<span style="color:var(--muted)">Names not parsed</span>'}</div>
        ${m.division ? `<div class="card-division">${esc(m.division)}</div>` : ''}
      </div>`;
  });
  el('container').innerHTML = html;
}

function renderProxyError(errors) {
  el('container').innerHTML = `
    <div class="error-card">
      <strong>All CORS proxies failed</strong>
      ${errors.map(e => `<div style="font-size:0.75rem;opacity:0.7">${esc(e)}</div>`).join('')}
    </div>
    <div class="info-card">
      The proxies that let this page fetch the schedule are rate-limited.
      The page will automatically retry in ${REFRESH_SECS} seconds, or tap <strong>Refresh Now</strong>.<br><br>
      You can also open <a href="${SOURCE_URL}" target="_blank" rel="noopener">mataction.com</a> directly.
    </div>`;
}

function renderJsRendered() {
  el('container').innerHTML = `
    <div class="info-card">
      <strong>Schedule loads dynamically</strong><br>
      The page renders in a browser but CORS proxies only fetch the empty HTML shell.<br><br>
      Open <a href="${SOURCE_URL}" target="_blank" rel="noopener">mataction.com</a> directly, or tap
      <strong>Refresh Now</strong> — a different proxy might return the rendered version.
    </div>`;
}

function renderRaw(bodyText, rawHtml) {
  const htmlSnippet = rawHtml ? rawHtml.substring(0, 3000) : '';
  el('container').innerHTML = `
    <div class="error-card">No schedule entries could be parsed — page content below (screenshot this and share it to get the parser fixed).</div>
    <div class="raw-fallback">${esc(bodyText.substring(0, 3000))}</div>
    ${htmlSnippet ? `<details style="margin-top:8px"><summary style="font-size:0.75rem;color:var(--muted);cursor:pointer;padding:8px 0">Raw HTML (for debugging)</summary><div class="raw-fallback" style="margin-top:6px;font-size:0.65rem">${esc(htmlSnippet)}</div></details>` : ''}`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
loadNameFilter();
resetCountdown();
doFetch(true);
</script>
