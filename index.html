<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Atlanta Schedule Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --accent: #6c63ff;
      --gold: #f5a623;
      --muted: #6b7280;
      --text: #e5e7eb;
      --green: #22c55e;
      --red: #ef4444;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    header {
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .refresh-btn {
      flex: 1;
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .refresh-btn:active { opacity: 0.8; }
    .refresh-btn:disabled { opacity: 0.5; cursor: default; }

    .countdown-wrap {
      text-align: right;
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .countdown-wrap span {
      display: block;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, monospace;
    }

    .status {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .status-dot.ok { background: var(--green); }
    .status-dot.err { background: var(--red); }
    .status-dot.loading {
      background: var(--accent);
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin: 20px 0 8px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute;
      left: 0; top: 12px; bottom: 12px;
      width: 3px;
      background: var(--accent);
      border-radius: 0 3px 3px 0;
    }

    .card-time {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }

    .card-location {
      font-size: 0.8rem;
      color: var(--accent);
      margin-top: 3px;
      font-weight: 500;
    }

    .card-names {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .fighter {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }
    .fighter.tracked {
      color: var(--gold);
      font-weight: 700;
    }
    .fighter-label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      width: 30px;
      flex-shrink: 0;
    }

    .card-division {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 8px;
    }

    .vs-divider {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding-left: 38px;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .raw-fallback {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 0.72rem;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 60vh;
      overflow-y: auto;
    }

    .error-card {
      background: #1f1215;
      border: 1px solid #3d1a22;
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--red);
      font-size: 0.85rem;
      margin-bottom: 10px;
    }
    .error-card a { color: var(--accent); }

    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--border) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 8px;
      height: 16px;
      margin-bottom: 6px;
    }
    @keyframes shimmer { 0%{background-position:200%} 100%{background-position:-200%} }

    .source-link {
      display: block;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 24px;
      text-decoration: none;
    }
    .source-link:hover { color: var(--accent); }
  </style>
</head>
<body>

<header>
  <h1>Battle of Atlanta</h1>
  <div class="subtitle">Schedule Tracker</div>
</header>

<div class="top-bar">
  <button class="refresh-btn" id="refresh-btn" onclick="doFetch()">Refresh Now</button>
  <div class="countdown-wrap">
    <span id="countdown">60</span>
    next refresh
  </div>
</div>

<div class="status" id="status">
  <div class="status-dot loading" id="status-dot"></div>
  <span id="status-text">Loading…</span>
</div>

<div id="container">
  <div class="card">
    <div class="skeleton" style="width:45%"></div>
    <div class="skeleton" style="width:30%;margin-top:4px"></div>
    <div class="skeleton" style="width:70%;margin-top:12px"></div>
    <div class="skeleton" style="width:60%"></div>
  </div>
</div>

<a class="source-link" href="https://www.mataction.com/battle-of-atlanta/schedule?search=&age=all&age_filter=&weight=&weight_unit=0&regs%5B%5D=5ddaab7b-1fa1-40bd-abd7-784d85b87737&regs%5B%5D=70acab5c-d792-4ee8-86b2-387922876848&regs%5B%5D=72768763-49e1-4c62-8fd2-e18f2632c33b&regs%5B%5D=7e333057-18eb-47d0-9ed1-bda71d07b26f&regs%5B%5D=bd767c42-dced-4163-b454-51fb98c285fd&regs%5B%5D=c7b53c77-eec7-4734-af3d-61ae40143145&regs%5B%5D=c838bdec-7007-49ce-b69d-365adbdce4e4&regs%5B%5D=ccdd8082-655f-4c24-9d91-55c0d1972001&regs%5B%5D=dc828c9e-aad7-4377-a5b3-83cb0b4dd215&regs%5B%5D=ebedec5a-947c-431b-a43c-b2594d78be97&regs%5B%5D=f90b389b-3454-4e36-8054-d12e34d01166&regs%5B%5D=8bc13f89-6954-44fa-8fc9-5777e32b8591" target="_blank" rel="noopener">
  View on MatAction ↗
</a>

<script>
const SOURCE_URL = 'https://www.mataction.com/battle-of-atlanta/schedule?search=&age=all&age_filter=&weight=&weight_unit=0&regs%5B%5D=5ddaab7b-1fa1-40bd-abd7-784d85b87737&regs%5B%5D=70acab5c-d792-4ee8-86b2-387922876848&regs%5B%5D=72768763-49e1-4c62-8fd2-e18f2632c33b&regs%5B%5D=7e333057-18eb-47d0-9ed1-bda71d07b26f&regs%5B%5D=bd767c42-dced-4163-b454-51fb98c285fd&regs%5B%5D=c7b53c77-eec7-4734-af3d-61ae40143145&regs%5B%5D=c838bdec-7007-49ce-b69d-365adbdce4e4&regs%5B%5D=ccdd8082-655f-4c24-9d91-55c0d1972001&regs%5B%5D=dc828c9e-aad7-4377-a5b3-83cb0b4dd215&regs%5B%5D=ebedec5a-947c-431b-a43c-b2594d78be97&regs%5B%5D=f90b389b-3454-4e36-8054-d12e34d01166&regs%5B%5D=8bc13f89-6954-44fa-8fc9-5777e32b8591';

const REG_IDS = [
  '5ddaab7b-1fa1-40bd-abd7-784d85b87737',
  '70acab5c-d792-4ee8-86b2-387922876848',
  '72768763-49e1-4c62-8fd2-e18f2632c33b',
  '7e333057-18eb-47d0-9ed1-bda71d07b26f',
  'bd767c42-dced-4163-b454-51fb98c285fd',
  'c7b53c77-eec7-4734-af3d-61ae40143145',
  'c838bdec-7007-49ce-b69d-365adbdce4e4',
  'ccdd8082-655f-4c24-9d91-55c0d1972001',
  'dc828c9e-aad7-4377-a5b3-83cb0b4dd215',
  'ebedec5a-947c-431b-a43c-b2594d78be97',
  'f90b389b-3454-4e36-8054-d12e34d01166',
  '8bc13f89-6954-44fa-8fc9-5777e32b8591',
];

// Proxies tried in order; rotate on failure
const PROXIES = [
  u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
];
let proxyIdx = 0;

let countdownTimer = null;
let countdownVal = 60;
let isFetching = false;

// ─── DOM helpers ────────────────────────────────────────────────────────────
const el = id => document.getElementById(id);

function setStatus(type, msg) {
  el('status-dot').className = 'status-dot ' + type;
  el('status-text').textContent = msg;
}

function resetCountdown() {
  clearInterval(countdownTimer);
  countdownVal = 60;
  el('countdown').textContent = countdownVal;
  countdownTimer = setInterval(() => {
    countdownVal--;
    el('countdown').textContent = countdownVal;
    if (countdownVal <= 0) doFetch();
  }, 1000);
}

// ─── Fetch ───────────────────────────────────────────────────────────────────
async function tryFetch(url) {
  const proxy = PROXIES[proxyIdx % PROXIES.length];
  const res = await fetch(proxy(url), { cache: 'no-store' });
  if (!res.ok) throw new Error(`Proxy HTTP ${res.status}`);
  const body = await res.text();
  // allorigins wraps in JSON; others return raw HTML
  try {
    const json = JSON.parse(body);
    if (json && typeof json.contents === 'string') return json.contents;
  } catch (_) {}
  return body;
}

async function doFetch() {
  if (isFetching) return;
  isFetching = true;
  el('refresh-btn').disabled = true;
  setStatus('loading', 'Fetching live schedule…');
  resetCountdown();

  let html = null;
  let lastErr = null;

  for (let attempt = 0; attempt < PROXIES.length; attempt++) {
    try {
      html = await tryFetch(SOURCE_URL);
      break;
    } catch (e) {
      lastErr = e;
      proxyIdx++;
    }
  }

  isFetching = false;
  el('refresh-btn').disabled = false;

  if (!html) {
    setStatus('err', 'Could not reach schedule — tap Refresh to retry');
    renderError(lastErr);
    return;
  }

  try {
    const matches = parseSchedule(html);
    render(matches, html);
    setStatus('ok', 'Updated ' + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus('err', 'Parse error — showing raw content');
    renderRaw(html);
  }
}

// ─── Parse ───────────────────────────────────────────────────────────────────
function parseSchedule(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const results = [];

  // Remove noise
  doc.querySelectorAll('script,style,nav,header,footer,noscript').forEach(n => n.remove());

  // ── Strategy A: rows with data-attributes (common in modern tournament apps) ─
  const regAttrEls = doc.querySelectorAll('[data-registration-id],[data-reg-id],[data-competitor-id]');
  if (regAttrEls.length > 0) {
    // Group siblings into matches
    const seen = new Set();
    regAttrEls.forEach(el => {
      const parent = el.closest('[class*="match"],[class*="bout"],[class*="row"],[class*="schedule"],tr') || el.parentElement;
      if (!parent || seen.has(parent)) return;
      seen.add(parent);
      results.push(extractFromContainer(parent, true));
    });
    if (results.length) return results.filter(Boolean);
  }

  // ── Strategy B: table rows ──────────────────────────────────────────────────
  const tables = doc.querySelectorAll('table');
  tables.forEach(table => {
    const headers = Array.from(table.querySelectorAll('th')).map(th => th.textContent.trim().toLowerCase());
    const rows = table.querySelectorAll('tbody tr, tr:not(:first-child)');
    rows.forEach(row => {
      const cells = Array.from(row.querySelectorAll('td'));
      if (cells.length < 2) return;
      const m = extractFromCells(cells, headers);
      if (m) results.push(m);
    });
  });
  if (results.length) return results;

  // ── Strategy C: class-name card divs ───────────────────────────────────────
  const CARD_SEL = [
    '[class*="schedule-item"]','[class*="match-item"]','[class*="bout"]',
    '[class*="fight"]','[class*="match-card"]','[class*="schedule-row"]',
    '[class*="competition"]'
  ].join(',');
  const cards = doc.querySelectorAll(CARD_SEL);
  cards.forEach(card => {
    const m = extractFromContainer(card, false);
    if (m) results.push(m);
  });
  if (results.length) return results;

  // ── Strategy D: any element with a time pattern near a name ────────────────
  const allText = doc.body ? doc.body.textContent : '';
  return extractFromRawText(allText);
}

const TIME_RE = /\b(\d{1,2}:\d{2}\s*(?:AM|PM)?)/gi;
const MAT_RE  = /\b(mat|ring|rink|court|area|floor|platform|table)\s*#?\s*(\d+[A-Z]?)/gi;

function extractFromContainer(el, hasTracked) {
  const text = el.textContent || '';
  const times = text.match(TIME_RE);
  const mats  = text.match(new RegExp(MAT_RE.source, 'gi'));

  // Try to find competitor name elements
  const nameEls = el.querySelectorAll(
    '[class*="name"],[class*="competitor"],[class*="athlete"],[class*="player"],[class*="fighter"],[class*="red"],[class*="blue"]'
  );
  const names = Array.from(nameEls)
    .map(n => n.textContent.trim())
    .filter(n => n.length > 2 && n.length < 60 && !/^\d/.test(n));

  if (!times && !mats && !names.length) return null;

  // Division hint
  const divEl = el.querySelector('[class*="division"],[class*="category"],[class*="class"],[class*="age"],[class*="weight"]');
  const division = divEl ? divEl.textContent.trim() : '';

  return {
    time: times ? times[0] : '',
    location: mats ? mats[0] : '',
    names: dedupe(names),
    division,
    trackedNames: [],
  };
}

function extractFromCells(cells, headers) {
  const texts = cells.map(c => c.textContent.trim());

  // Find time column
  let time = '', location = '', names = [], division = '';

  if (headers.length) {
    headers.forEach((h, i) => {
      if (!texts[i]) return;
      if (/time|start/i.test(h))      time = texts[i];
      else if (/mat|ring|rink|court/i.test(h)) location = texts[i];
      else if (/division|class|age|weight|category/i.test(h)) division = texts[i];
      else if (/name|competitor|athlete|player|red|blue/i.test(h)) names.push(texts[i]);
    });
  }

  // Fallback: look for patterns in cell content
  if (!time) {
    const t = texts.find(t => TIME_RE.test(t));
    if (t) time = t.match(TIME_RE)[0];
  }
  if (!location) {
    const l = texts.find(t => new RegExp(MAT_RE.source, 'i').test(t));
    if (l) {
      const m = l.match(new RegExp(MAT_RE.source, 'i'));
      if (m) location = m[0];
    }
  }
  if (!names.length) {
    names = texts.filter(t => {
      if (!t || t.length < 3 || t.length > 60) return false;
      if (TIME_RE.test(t)) return false;
      if (new RegExp(MAT_RE.source, 'i').test(t)) return false;
      if (/^\d+$/.test(t)) return false;
      if (/division|class|age|weight|category/i.test(t) && t.length < 30) return false;
      // Names have at least a space (first + last)
      return t.includes(' ') || t.length < 25;
    });
  }

  if (!time && !location && !names.length) return null;
  return { time, location, names: dedupe(names), division, trackedNames: [] };
}

function extractFromRawText(text) {
  // Last resort: scan plain text for time+name blocks
  const lines = text.split(/\n/).map(l => l.trim()).filter(Boolean);
  const results = [];
  let current = null;

  lines.forEach(line => {
    const timeMatch = line.match(TIME_RE);
    const matMatch  = line.match(new RegExp(MAT_RE.source, 'i'));

    if (timeMatch || matMatch) {
      if (current) results.push(current);
      current = {
        time: timeMatch ? timeMatch[0] : '',
        location: matMatch ? matMatch[0] : '',
        names: [],
        division: '',
        trackedNames: [],
      };
    } else if (current && line.length > 2 && line.length < 60 && !line.startsWith('<')) {
      current.names.push(line);
    }
  });
  if (current) results.push(current);
  return results;
}

function dedupe(arr) {
  return [...new Set(arr.map(s => s.trim()).filter(Boolean))];
}

// ─── Render ──────────────────────────────────────────────────────────────────
function render(matches, rawHtml) {
  const container = el('container');

  if (!matches || matches.length === 0) {
    // Check if the page is JavaScript-rendered (no actual content in HTML)
    const parser = new DOMParser();
    const doc = parser.parseFromString(rawHtml, 'text/html');
    doc.querySelectorAll('script,style').forEach(n => n.remove());
    const bodyText = (doc.body?.textContent || '').trim();

    if (bodyText.length < 200) {
      container.innerHTML = `
        <div class="error-card">
          <strong>JavaScript-rendered page</strong><br><br>
          This schedule loads dynamically in the browser, so a proxy can't capture it directly.<br><br>
          <strong>Workarounds:</strong><br>
          1. Open <a href="${SOURCE_URL}" target="_blank" rel="noopener">mataction.com</a> and use it directly on mobile.<br>
          2. Share this page — tap <em>Refresh</em> periodically; if the proxy provider adds JS rendering support it will work automatically.
        </div>`;
    } else {
      container.innerHTML = `
        <div class="error-card">No schedule entries found — the page structure may have changed.</div>
        <div class="section-label">Raw page content (debug)</div>
        <div class="raw-fallback">${escHtml(bodyText.substring(0, 4000))}</div>`;
    }
    return;
  }

  let html = `<div class="section-label">${matches.length} match${matches.length !== 1 ? 'es' : ''} found</div>`;

  matches.forEach(m => {
    const nameRows = m.names.map((name, i) => {
      const label = i === 0 ? 'Red' : i === 1 ? 'Blue' : '';
      const tracked = m.trackedNames && m.trackedNames.includes(name);
      return `
        ${i === 1 ? '<div class="vs-divider">vs</div>' : ''}
        <div class="fighter ${tracked ? 'tracked' : ''}">
          ${label ? `<span class="fighter-label">${label}</span>` : ''}
          ${escHtml(name)}
        </div>`;
    }).join('');

    html += `
      <div class="card">
        <div class="card-time">${escHtml(m.time || '—')}</div>
        <div class="card-location">${escHtml(m.location || 'Location TBD')}</div>
        <div class="card-names">${nameRows || '<span style="color:var(--muted)">Names not parsed</span>'}</div>
        ${m.division ? `<div class="card-division">${escHtml(m.division)}</div>` : ''}
      </div>`;
  });

  container.innerHTML = html;
}

function renderError(err) {
  el('container').innerHTML = `
    <div class="error-card">
      <strong>Network error</strong><br>
      ${escHtml(String(err?.message || err))}<br><br>
      All ${PROXIES.length} CORS proxies failed. This may be a temporary issue.<br>
      Try refreshing or open <a href="${SOURCE_URL}" target="_blank" rel="noopener">mataction.com directly</a>.
    </div>`;
}

function renderRaw(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,noscript').forEach(n => n.remove());
  const text = doc.body?.textContent?.trim() || html;
  el('container').innerHTML = `
    <div class="error-card">Could not parse schedule structure — raw content below.</div>
    <div class="raw-fallback">${escHtml(text.substring(0, 5000))}</div>`;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
doFetch();
</script>
</body>
</html>
